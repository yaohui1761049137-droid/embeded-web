# pps_tod_watchdog.conf - thresholds for the sync-chain watchdog
# sourced by /usr/local/bin/pps_tod_watchdog.sh
GOOD_WINDOW=30        # max seconds without a GOOD sample before taking action
STALE_MAX=5           # status file older than this many seconds = daemon dead
RESTART_COOLDOWN=60   # minimum seconds between two restart actions
MAX_RESTARTS=3        # max restarts per rolling hour before DEGRADED
OBSERVE_GRACE=60      # seconds after a restart to regain GOOD before DEGRADED
START_GRACE=60        # ignore failures for this long after watchdog start
ALERT_INTERVAL=60     # rate-limit for DEGRADED alert lines
LOG_MAX_KB=512        # cap for watchdog.log in KB; 0 = keep everything
LOG_KEEP_LINES=2000   # newest lines kept when the cap is hit (~300KB at 150B/line)
NTP_GUARD=1           # 1 = DEGRADED/RECOVERING auto-runs `chronyc disable ntp`
                      #     (board stops answering NTP while the clock is not
                      #     vouched for) and re-enables on recovery; during
                      #     maintenance set 0 so the watchdog never touches
                      #     chrony serving
